[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opticargo-agents"
version = "1.0.0"
description = "Internal OptiCargo agent orchestration service and integration adapters."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # The runtime image installs the immutable local Shared wheel first.  A
    # VCS URL here makes pip require git inside the slim image and can silently
    # resolve a different main-branch contract than the bundled wheel.
    "opticargo-shared==1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "anyio>=4",
    "opticargo-ml-models @ git+https://github.com/Project-OptiCargo-Tol-Laut/opticargo-ml-models.git@main",
]
shared = ["opticargo-shared==1.0.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
