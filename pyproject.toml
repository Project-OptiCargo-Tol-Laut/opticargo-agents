[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opticargo-agents"
version = "1.0.0"
description = "Internal OptiCargo agent orchestration service and integration adapters."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "opticargo-shared @ git+https://github.com/Project-OptiCargo-Tol-Laut/opticargo-shared.git@main",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
shared = ["opticargo-shared==1.0.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests/unit"]