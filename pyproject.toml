[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "opticargo_agents"
version = "0.1.0"
description = "LangGraph Orchestrator for OptiCargo AI"
authors = [
    { name = "OptiCargo AI Team" }
]
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.1.0",
    "langchain-google-genai>=1.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "groq>=0.9.0",
    "requests>=2.31.0",
    "opticargo-shared==1.0.0",
    "opticargo-rag-pipeline>=0.1.0",
    "opticargo-knowledge-graph>=0.1.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "flake8>=6.0"
]
