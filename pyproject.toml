[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "opticargo_agents"
version = "0.1.0"
description = "LangGraph Orchestrator for OptiCargo AI"
authors = [
    { name = "OptiCargo AI Team" }
]
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.1.0",
    "langchain-google-genai>=1.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "opticargo_shared>=0.1.0",
    "opticargo_rag_pipeline>=0.1.0",
    "opticargo_knowledge_graph>=0.1.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "flake8>=6.0"
]
